  # ImageFile Operations

  /v1/imagefile/{ref}:
    get:
      tags:
        - "image"
      summary: "Download Image"
      description: "Download the image file for an image"
      operationId: "DownloadImage"
      parameters:
        - in: path
          required: true
          name: ref
          type: string
          description: "ID of an image"
          x-example: "project123/bioinformatics-tools/bwa:v1"
      security:
        - Bearer: []
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/fileResponse"
        401:
          description: Not authorized to download this image
          schema:
            $ref: "#/definitions/json401error"
        403:
