          schema:
            $ref: "#/definitions/json403error"
        500:
          description: Server internal error
          schema:
            $ref: "#/definitions/json500error"
        507:
          description: Over quota for upload
          schema:
            $ref: "#/definitions/json507error"

  # Search Operations

  /v1/search:
    get:
      tags:
        - "search"
      summary: "Search the library"
      description: "Search the library for a value"
      operationId: "Search"
      parameters:
        - name: model
          in: query
          required: false
          type: string
          description: "model in the library to search. If empty all models will be searched"
          x-example: "entity"
        - name: field
          in: query
          required: false
          type: string
          description: "field to search, multiple fields comma separated. If empty will search name"
          x-example: "name,description"
        - name: value
          in: query
          required: true
          type: string
          minLength: 3
          description: "value to search for"
          x-example: "tensorflow"
        - name: arch
          in: query
          required: false
          type: string
          description: "The image architecture array to search, if arch is provided, will only search images with the specified arch"
          x-example: "arm64,amd64"
        - name: signed
          in: query
          required: false
          type: string
          description: "A flag to optionally search for signed, or unsigned images. If omitted both signed and unsigned images are returned"
          x-example: "true"
        - name: encrypted
          in: query
          required: false
          type: string
          description: "A flag to optionally search for encrypted, or unencrypted images. If omitted both encrypted and unencrypted images are returned"
          x-example: "true"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/searchResponse"
        400:
          description: Provided search parameters were not valid
          schema:
            $ref: "#/definitions/json400error"
        500:
          description: Server internal error
